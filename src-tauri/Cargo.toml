[package]
name = "chronote"
version = "0.1.7"
description = "Chronote - Lightweight local-first desktop engineering notebook"
authors = ["Chronote Authors"]
license = "MIT"
repository = "https://github.com/SathveeganYogendrarajah2000/chronote"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chronote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2.0"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
rfd = "0.15"
walkdir = "2.5.0"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.17"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
