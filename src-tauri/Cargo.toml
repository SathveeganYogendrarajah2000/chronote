[package]
name = "chronote"
version = "0.1.0"
description = "Chronote - Lightweight local-first desktop engineering notebook"
authors = ["Chronote Authors"]
license = "MIT"
repository = "https://github.com/SathveeganYogendrarajah2000/chronote"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chronote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2.0"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
