name: Release Windows Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-release-installers:
    name: Package Windows NSIS & MSI Installers
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Verification Suite
        run: |
          pnpm run build
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Windows Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Chronote ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for detailed release notes and migration guides."
          releaseDraft: false
          prerelease: false
          args: --verbose
